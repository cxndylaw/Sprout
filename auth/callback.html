<!DOCTYPE html>
<html>
<head>
    <title>Signing in...</title>
</head>

<body>
    <p>Signing you in to Sprout 🌱...</p>

    <script type="module">
        import { supabase } from "../js/supabase.js";

        const { data, error } = await supabase.auth.getSession();

        if (error) {
            console.error(error);
        }

        if (data.session) {
            window.location.href = "../index.html";
        }
    </script>

</body>
</html>
